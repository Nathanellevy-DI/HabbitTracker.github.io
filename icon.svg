<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="flame-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="chain-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Background (Zero Edges/Margins) -->
  <rect width="512" height="512" fill="url(#bg-grad)"/>

  <!-- Subtle Radial Aura -->
  <circle cx="256" cy="256" r="180" fill="#f59e0b" opacity="0.12" filter="url(#glow)" />

  <!-- Outer Chain Link Ring -->
  <path d="M 216 140 H 296 C 340 140 376 176 376 220 C 376 264 340 300 296 300 H 216 C 172 300 136 264 136 220 C 136 176 172 140 216 140 Z" 
        fill="none" stroke="url(#chain-grad)" stroke-width="28" stroke-linecap="round"/>

  <!-- Inner Interlocking Chain Link -->
  <path d="M 216 212 H 296 C 340 212 376 248 376 292 C 376 336 340 372 296 372 H 216 C 172 372 136 336 136 292 C 136 248 172 212 216 212 Z" 
        fill="none" stroke="url(#chain-grad)" stroke-width="28" stroke-linecap="round" opacity="0.75"/>

  <!-- Center Flame Emblem (Streak Icon) -->
  <path d="M 256 160 C 256 160 290 205 290 240 C 290 260 276 276 256 276 C 236 276 222 260 222 240 C 222 210 242 195 242 195 C 242 195 248 215 256 225 C 262 232 270 236 270 244 C 270 252 264 258 256 258 C 248 258 244 252 244 246" 
        fill="url(#flame-grad)" filter="url(#glow)"/>

  <!-- Bold Accent Bolt -->
  <path d="M 264 180 L 236 240 H 260 L 248 300 L 284 230 H 256 Z" fill="#ffffff" opacity="0.9"/>
</svg>
